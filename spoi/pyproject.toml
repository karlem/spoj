[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "spoi"
version = "0.1.0"
description = "Local Qwen3 MoE expert-placement experiment"
requires-python = ">=3.11"
dependencies = ["torch>=2.8,<3", "transformers>=5.3,<6", "psutil>=7,<8"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
